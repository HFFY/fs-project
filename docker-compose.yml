# docker-compose.yml
#
# Las credenciales NO viven en este archivo: Compose las lee del .env de la
# raiz (ignorado por Git). Copia .env.example a .env antes de levantarlo.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ para que la variable la expanda el contenedor y no Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica las migraciones de Prisma y termina. Usa la etapa `build` del
  # Dockerfile del backend, que es la que tiene el CLI de Prisma,
  # prisma.config.ts y la carpeta prisma/.
  migrate:
    build:
      context: ./task-manager-react/backend
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./task-manager-react/backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      PORT: 3000
    # El frontend llama a http://localhost:3000, por eso el backend escucha
    # en PORT=3000 y se publica el mismo puerto.
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./task-manager-react
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
