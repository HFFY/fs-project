# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica las migraciones de Prisma y termina. Usa la etapa `build` del
  # Dockerfile del backend, que es la que tiene el CLI de Prisma,
  # prisma.config.ts y la carpeta prisma/.
  migrate:
    build:
      context: ./task-manager-react/backend
      target: build
    environment:
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./task-manager-react/backend
    restart: always
    environment:
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
    # El puerto 3000 esta fijo en src/index.ts y el frontend llama a
    # http://localhost:3000, por eso se publica el mismo puerto.
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./task-manager-react
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
