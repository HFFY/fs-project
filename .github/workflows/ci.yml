name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe DEPLOY para confirmar el despliegue a produccion'
        required: true

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
      - run: npm run typecheck

  pruebas-backend:
    name: Backend - Pruebas con variables seguras
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/backend/package-lock.json
      # Falla con un mensaje claro si falta un Secret, sin imprimir su valor.
      - name: Verificar que los Secrets existen
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Falta el Secret DATABASE_URL"; exit 1; }
          test -n "$JWT_SECRET" || { echo "::error::Falta el Secret JWT_SECRET"; exit 1; }
      - run: npm ci
      - run: npm run test

  migraciones:
    name: Migraciones y Seeds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./task-manager-react/backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npx prisma db seed
      - name: Seed por segunda vez (debe ser reproducible)
        run: npx prisma db seed
      - name: Verificar que no quedan migraciones pendientes
        run: npx prisma migrate status

  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/package-lock.json
      - run: npm ci
      - run: npx vitest run --coverage

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: task-manager-react/playwright-report/
          retention-days: 30

  # Se dispara solo en cada push a main (es decir, cada merge de un PR)
  # y unicamente si todos los checks anteriores pasaron.
  # Usa un Project Token de Railway generado para el environment "staging".
  deploy-staging:
    name: Deploy a Staging (automatico)
    needs: [frontend, backend, pruebas-backend, pruebas, e2e, migraciones]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el Secret existe
        run: test -n "$RAILWAY_TOKEN" || { echo "::error::Falta el Secret RAILWAY_TOKEN_STAGING"; exit 1; }
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      - name: Desplegar a Railway (staging)
        run: railway up ./task-manager-react/backend --path-as-root --ci --service backend --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
  
  # Nunca se dispara solo: requiere lanzar el workflow a mano desde main
  # (Actions > CI > Run workflow) y escribir DEPLOY como confirmacion.
  deploy-produccion:
    name: Deploy a Producción (manual)
    needs: [frontend, backend, pruebas-backend, pruebas, e2e, migraciones]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmacion == 'DEPLOY' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      # El Dockerfile vive en task-manager-react/backend, no en la raiz:
      # --path-as-root sube solo esa carpeta como raiz del build.
      - name: Desplegar a Railway (produccion)
        run: railway up ./task-manager-react/backend --path-as-root --ci --service backend --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

