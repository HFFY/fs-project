name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-react/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: task-manager-react/backend/package-lock.json
      - run: npm ci
      # `prisma generate` no se conecta a la base de datos, pero prisma.config.ts
      # exige que DATABASE_URL exista. Valor ficticio a proposito.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
      - run: npm run typecheck
